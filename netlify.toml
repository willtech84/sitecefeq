# Configuração do Netlify
# Remove index.html da URL

[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Headers para sitemap.xml
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    X-Content-Type-Options = "nosniff"

# Headers para robots.txt
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Headers de cache para imagens (melhora performance)
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"
    Accept-Ranges = "bytes"

# Headers de cache para todas as imagens (incluindo WebP)
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers de cache para logo (LCP image)
[[headers]]
  for = "/img/logo.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Headers de cache para CSS e JS
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers de cache para fontes
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirecionar /index.html para / (remove index.html da URL)
[[redirects]]
  from = "/feed/meta-products.csv"
  to = "/.netlify/functions/meta-products"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Redirecionar /index para /
[[redirects]]
  from = "/index"
  to = "/"
  status = 301
  force = true
